<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aqua;
        }
        .container{
            width:200px;
            height:200px;
            margin:200px;
            padding:50px;
            border:5px black solid;
            background-color: chocolate;
            color:black;
            font-size: larger;
            text-align: center;
        }
        .container:hover{
            width:250px;
            height:250px;
            background-color:crimson ;
            transform: translateX(100px);
            transition-duration: 0.5s;
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <div class="container">
        <p>This is a simple container for the main content.</p>
    </div>
</body>
</html>
